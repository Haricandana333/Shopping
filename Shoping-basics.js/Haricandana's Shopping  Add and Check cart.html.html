        body {

        overheader{
            text-align: center;

            position: relative;
            animation-name: example;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            }

            @keyframes example {
            0%   {background-color:red; left:0px; top:0px;}
            25%  {background-color:yellow; left:200px; top:0px;}
            50%  {background-color:blue; left:200px; top:200px;}
            75%  {background-color:green; left:0px; top:200px;}
            100% {background-color:red; left:0px; top:0px;}
        }






        header {
           
            background-color: #4c57eb;
            color: #fff;
            padding: 50px;
            text-align: center;
            width: 1060px;
            box-shadow: 0px 0px 7px 7px lightblue;
           
        }



        #product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 5px;
          
            
            
        }

        .product {
            border: 1px solid #e06464;
            border-radius: 5px;
            background-color: yellow;
            margin: 10px;
            padding: 6px;
            width: 200px;
            text-align: center;
        }

        button {
            background-color: #9b4caf;
            color: rgb(39, 7, 7);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #cart {
            background-color: #1cf16d;
            color: rgb(32, 32, 26);
            padding: 20px;
            position: fixed;
            top: 0;
            right: 0;
            width: 90px;
            height: 100%;
            border-radius: 10px;
            overflow-y: auto;
        }



        #Your-carts{

        #cart-item {

        #total {

        #checkout-btn {

            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        #checkout-btn:hover {
            background-color: #b92976;
        }


    </style>


</head>

    <script>
        let cart = [];

        function addToCart(productId) {
            const product = document.querySelector(`[data-id="${productId}"]`);
            const productName = product.dataset.name;
            const productPrice = parseFloat(product.dataset.price);

            cart.push({ id: productId, name: productName, price: productPrice });
            updateCart();
        }


        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const totalElement = document.getElementById('total');
            let total = 0;

            cartItems.innerHTML = '';

            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.id = `cart-item-${item.id}`;
                cartItem.classList.add('cart-item');

                cartItem.innerHTML = `
                    <div>${item.name}</div>
                    <div>$${item.price.toFixed(2)}</div>
                    <button onclick="removeFromCart(${item.id})">Remove</button>
                `;

                cartItems.appendChild(cartItem);
                total += item.price;
            });

            totalElement.textContent = `Total: $${total.toFixed(2)}`;
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }


        function checkout() {
            // Implement your checkout logic here
            alert(' From Haricandana.Thank you for your purchase!');
            cart = [];
            updateCart();
        }



        setInterval(myTimer, 1000);
        function myTimer() {
          const d = new Date();
          document.getElementById("demo3").innerHTML = d.toLocaleTimeString();
        }
    </script>
